<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D1E4A">
<title>Dushell — Plataforma B2B de Compras e Cotações · Protótipo Navegável</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  color-scheme:light;
  --navy:#0D1E4A;--navy2:#091634;--navy3:#16295C;
  --blue:#2563EB;--blue-d:#1E4FD0;--blue-t:#E8EEFC;--blue-l:#5B8DEF;
  --lav:#EEF1FB;--lav-l:#DDE4F6;
  --ice:#F3F5FA;--card:#FFFFFF;
  --ink:#101B38;--mut:#566179;--soft:#8A94AE;
  --line:#E4E9F4;--line2:#D5DCEC;
  --ok:#15803D;--ok-t:#E7F5EC;
  --warn:#92610B;--warn-t:#FBF2DC;
  --err:#C03434;--err-t:#FBEAEA;
  --info:#1F5F9E;--info-t:#E7F1FB;
  --mint-t:#E7F5EC;--mint:#15803D;
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Archivo',sans-serif;background:var(--ice);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Sora',sans-serif;line-height:1.22;letter-spacing:-.01em;text-wrap:balance}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
input[type="checkbox"],input[type="radio"]{accent-color:var(--blue)}
.mono{font-family:'IBM Plex Mono',monospace}
img{display:block}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{flex-shrink:0}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ================= FAIXA DE PROTÓTIPO ================= */
.strip{height:30px;background:var(--navy2);color:#AEBBE0;display:flex;align-items:center;justify-content:center;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;padding:0 12px;text-align:center}
.strip .dot{width:6px;height:6px;border-radius:50%;background:var(--blue-l)}
.strip b{color:#EAF0FF;font-weight:500}

/* ================= BOOT FALLBACK ================= */
.boot{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.boot-brand{display:flex;align-items:center;gap:10px;font-family:'Sora',sans-serif;font-weight:800;font-size:24px;color:var(--navy)}
.boot-sub{color:var(--soft);font-size:13px}
.boot-msg{margin-top:12px;background:var(--err-t);color:var(--err);padding:10px 16px;border-radius:8px;font-size:13px;max-width:420px;text-align:center}

/* ================= LOGO ================= */
.logo-sq{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:var(--blue);border-radius:10px;font-family:'Sora',sans-serif;font-weight:800;flex-shrink:0;box-shadow:0 1px 3px rgba(9,22,52,.18)}
.logo-sq.inv{background:var(--blue);color:#fff;box-shadow:none}

/* ================= BOTÕES ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:14px;transition:all .15s;line-height:1.3;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-d)}
.btn-s{background:#fff;border-color:var(--line2);color:var(--ink)}
.btn-s:hover{border-color:var(--blue);color:var(--blue)}
.btn-g{background:transparent;color:var(--mut)}
.btn-g:hover{background:#E9EDF6;color:var(--ink)}
.btn-d{background:#fff;border-color:#EFC5C5;color:var(--err)}
.btn-d:hover{background:var(--err-t)}
.btn-dark{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#EFF3FC}
.btn-dark:hover{background:rgba(255,255,255,.16)}
.btn-lg{padding:12px 22px;font-size:15px;border-radius:11px}
.btn-sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.blk{width:100%}

/* ================= FORMULÁRIOS ================= */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#33406B}
.fld label .opt{color:var(--soft);font-weight:500}
.inp,.sel,.txa{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:9px;background:#fff;outline:none;transition:border .15s, box-shadow .15s}
.inp:focus,.sel:focus,.txa:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.inp.bad,.sel.bad{border-color:var(--err);box-shadow:0 0 0 3px rgba(192,52,52,.1)}
.txa{resize:vertical;min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.hint{font-size:12px;color:var(--soft);margin-top:6px;line-height:1.5}
.chkline{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:6px 0;cursor:pointer}
.chkline input{width:16px;height:16px}
.chkline.bad span{color:var(--err);font-weight:600}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.doc-msg{font-size:11.5px;margin-top:4px;font-weight:600;line-height:1.4}
.doc-msg.ok{color:var(--ok)}
.doc-msg.err{color:var(--err)}

.seg{display:flex;background:#E9EDF6;border-radius:12px;padding:4px;gap:4px;margin:14px 0 6px}
.seg label{flex:1;text-align:center;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--mut);cursor:pointer;transition:all .15s;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(16,27,60,.14)}

/* ================= STEPPER ================= */
.steps{display:flex;margin:2px 0 24px}
.steps .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.steps .st::before{content:'';position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line2)}
.steps .st:first-child::before{display:none}
.steps .st.done::before,.steps .st.cur::before{background:var(--blue)}
.steps .sn{width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--soft);position:relative;z-index:1}
.steps .st.cur .sn{border-color:var(--blue);color:var(--blue)}
.steps .st.done .sn{background:var(--blue);border-color:var(--blue);color:#fff}
.steps .sl{font-size:11px;font-weight:600;color:var(--soft);text-align:center}
.steps .st.cur .sl{color:var(--blue-d)}

/* ================= BADGES / TAGS ================= */
.bdg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;white-space:nowrap}
.bdg svg{width:13px;height:13px}
.st-ok{background:var(--ok-t);color:var(--ok)}
.st-warn{background:var(--warn-t);color:var(--warn)}
.st-err{background:var(--err-t);color:var(--err)}
.st-info{background:var(--info-t);color:var(--info)}
.st-mut{background:#EDF0F7;color:var(--mut)}
.st-mint{background:var(--mint-t);color:var(--mint)}
.st-cop{background:var(--blue-t);color:var(--blue-d)}
.tag-rn{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--warn);background:var(--warn-t);border:1px dashed #E3CD96;padding:4px 9px;border-radius:6px}
.tag-rn svg{width:12px;height:12px}
.tag-fut{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);border:1px dashed var(--line2);padding:4px 9px;border-radius:6px}
.tag-fut svg{width:12px;height:12px}
.disp{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.disp .d{width:7px;height:7px;border-radius:50%}
.d-ok{background:var(--ok)}.d-warn{background:#C99A2E}.d-info{background:var(--info)}
.dp-ok{color:var(--ok)}.dp-warn{color:var(--warn)}.dp-info{color:var(--info)}
.sku{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mut);letter-spacing:.02em}
.uslab{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600;margin-bottom:6px}
.etchip{font-size:11.5px;font-weight:700;color:var(--blue-d);background:var(--blue-t);padding:4px 11px;border-radius:999px;white-space:nowrap}

/* ================= PAINÉIS / LAYOUT ================= */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,27,60,.04),0 4px 16px rgba(16,27,60,.05)}
.p-pad{padding:22px 24px}
.wrap{max-width:1180px;margin:0 auto;padding:26px 30px 70px}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:12px;flex-wrap:wrap}
.crumb a{color:var(--mut)}
.crumb a:hover{color:var(--blue);text-decoration:underline}
.crumb .cur{color:var(--ink);font-weight:600}
.cr-sep{width:13px;height:13px;color:var(--line2)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:2px 0 18px;flex-wrap:wrap}
.page-h h1{font-size:25px;font-weight:700}
.page-h .sub{color:var(--mut);font-size:14px;margin-top:5px;max-width:640px}
.page-h .acts{display:flex;gap:10px;flex-wrap:wrap}
.story{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--blue) 7%,white);border:1px solid var(--lav-l);border-radius:10px;padding:11px 14px;font-size:13px;color:#33406B;margin:0 0 20px;line-height:1.5}
.story svg{width:15px;height:15px;color:var(--blue);margin-top:2px}
.sep{border:none;border-top:1px solid var(--line);margin:20px 0}
.note{display:flex;gap:10px;align-items:flex-start;background:#F7F9FD;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:#44506E;line-height:1.5}
.note svg{width:16px;height:16px;color:var(--blue);margin-top:2px}
.note.warnn{background:var(--warn-t);border-color:#EBDDB0}
.note.warnn svg{color:var(--warn)}

/* ================= TABELAS ================= */
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
.tbl th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap;position:sticky;top:0;background:#fff}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr.rowc{cursor:pointer;transition:background .12s}
.tbl tbody tr.rowc:hover{background:#F7F9FD}
.tbl .num{font-family:'IBM Plex Mono',monospace;font-size:13px}
.tbl .rgt{text-align:right}

/* ================= SHELL DO APP ================= */
.shell{display:grid;grid-template-columns:252px 1fr;min-height:calc(100vh - 30px)}
.sb{background:var(--navy);color:#B4C1E4;display:flex;flex-direction:column;position:sticky;top:42px;height:calc(100vh - 54px);margin:12px 0 12px 12px;border-radius:18px;overflow:hidden}
.sb-logo{display:flex;align-items:center;gap:11px;padding:18px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo .nm{font-family:'Sora',sans-serif;font-weight:700;font-size:16.5px;color:#fff;letter-spacing:.02em}
.sb-logo .nm small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:8.5px;letter-spacing:.16em;color:#7C8DBE;margin-top:2px}
.nav{padding:12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-lb{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:#68799F;padding:12px 10px 6px}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:14px;font-weight:500;color:#B4C1E4;cursor:pointer;position:relative;transition:background .14s,color .14s;border:none;background:none;width:100%;text-align:left}
.nav-i svg{width:17px;height:17px;opacity:.85}
.nav-i:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-i.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.nav-i.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--blue-l)}
.nav-i .nbdg{margin-left:auto;background:var(--blue);color:#fff;font-size:10.5px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.nav-i .next{margin-left:auto;width:14px;height:14px;opacity:.55}
.sb-ft{border-top:1px solid rgba(255,255,255,.08);padding:12px}
.sb-cred{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#68799F;padding:2px 11px 10px}
.ubox{display:flex;align-items:center;gap:10px;padding:10px 11px;background:rgba(255,255,255,.06);border-radius:10px;cursor:pointer;transition:background .14s}
.ubox:hover{background:rgba(255,255,255,.1)}
.avat{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;font-family:'Sora',sans-serif;flex-shrink:0}
.ubox .un{font-size:13px;font-weight:600;color:#fff;line-height:1.25}
.ubox .ur{font-size:11px;color:#8B9BC7}
.ubox>svg{margin-left:auto;width:15px;height:15px;color:#8B9BC7}
#umenu{position:relative}
#umenu .um-inner{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--navy2);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:6px;z-index:50;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
.main{min-width:0}
.topbar{position:sticky;top:30px;z-index:30;background:rgba(243,245,250,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 22px;height:60px}
.tb-search{position:relative;width:min(300px,30vw)}
.tb-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--soft)}
.tb-search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;font-size:13.5px}
.tb-search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.tb-title{font-family:'Sora',sans-serif;font-weight:600;font-size:14.5px}
.tb-title small{display:block;font-family:'Archivo',sans-serif;font-weight:400;font-size:11.5px;color:var(--mut);margin-top:-1px}
.tb-sp{flex:1}
.icobtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;color:#44506E;transition:all .15s}
.icobtn:hover{border-color:var(--blue);color:var(--blue)}
.icobtn svg{width:17px;height:17px}
.icobtn .nd{position:absolute;top:-4px;right:-4px;background:var(--blue);color:#fff;font-size:9.5px;font-weight:700;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--ice)}
#hamb{display:none}
.nav-ovl{display:none}
.bnav{display:none}

/* ================= TELAS PÚBLICAS ================= */
.pub-head{display:flex;align-items:center;justify-content:space-between;padding:16px 34px;max-width:1280px;margin:0 auto;width:100%;flex-wrap:wrap;gap:10px}
.brand{display:flex;align-items:center;gap:11px}
.brand .nm{font-family:'Sora',sans-serif;font-weight:700;font-size:17px;color:var(--navy)}
.brand .nm small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:8.5px;letter-spacing:.15em;color:var(--soft);margin-top:1px}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;max-width:1180px;margin:0 auto;padding:44px 34px 60px;align-items:start}
.kick{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.kick::before{content:'';width:26px;height:2px;background:var(--blue)}
.hero h1{font-size:clamp(30px,3.5vw,44px);font-weight:800;letter-spacing:-.02em;color:var(--navy)}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero .lead{margin:16px 0 24px;font-size:16px;color:#44506E;max-width:530px}
.feat{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.feat .fi{display:flex;gap:13px;align-items:flex-start}
.feat .fic{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--blue);flex-shrink:0}
.feat .fic svg{width:17px;height:17px}
.feat b{font-size:14.5px;display:block}
.feat span{font-size:13px;color:var(--mut)}
.hero-foot{display:flex;gap:18px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.hero-foot a{font-weight:600;color:var(--blue);border-bottom:1px solid transparent}
.hero-foot a:hover{border-color:var(--blue)}
.heropanel{background:var(--navy);border-radius:20px;padding:24px;color:#C7D2EC;box-shadow:0 20px 50px -18px rgba(9,22,52,.5)}
.heropanel .hp-t{font-family:'Sora',sans-serif;font-weight:600;font-size:17px;color:#fff;margin-bottom:4px}
.heropanel .hp-s{font-size:13px;color:#8B9BC7;margin-bottom:16px}
.pcard{display:flex;gap:15px;align-items:flex-start;padding:16px;border:1px solid rgba(255,255,255,.14);border-radius:13px;background:rgba(255,255,255,.05);cursor:pointer;transition:all .18s;width:100%;text-align:left;color:inherit;margin-bottom:12px}
.pcard:hover{border-color:var(--blue-l);background:rgba(255,255,255,.09);transform:translateY(-2px)}
.pcard .pic{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#A9C3F5;flex-shrink:0}
.pcard .pic svg{width:20px;height:20px}
.pcard b{font-family:'Sora',sans-serif;font-size:15px;color:#fff;display:block;margin-bottom:3px}
.pcard span{font-size:13px;color:#8B9BC7;line-height:1.45;display:block}
.pcard .go{margin-left:auto;color:#7C8DBE;align-self:center;width:18px;height:18px}
.pcard:hover .go{color:var(--blue-l)}
.flowline{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;color:#8B9BC7;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flowline svg{width:12px;height:12px;color:var(--blue-l)}
.hp-login{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hp-login span{font-size:12.5px;color:#8B9BC7}

.pick-wrap{max-width:880px;margin:0 auto;padding:50px 30px 80px}
.back{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--mut);margin-bottom:24px;font-weight:500}
.back:hover{color:var(--blue)}
.back svg{width:15px;height:15px}
.pick-wrap h1,.pick-h1{font-size:clamp(25px,3vw,33px);font-weight:700;text-align:center;letter-spacing:-.02em;color:var(--navy)}
.psub{text-align:center;color:var(--mut);margin:10px auto 34px;max-width:500px}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:28px}
.pickc{background:#fff;border:1.5px solid var(--line2);border-radius:16px;padding:26px;cursor:pointer;transition:all .18s;text-align:left;position:relative;display:block;width:100%}
.pickc:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px rgba(16,27,60,.28);border-color:var(--blue)}
.pickc.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.pickc .rad{position:absolute;top:20px;right:20px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2)}
.pickc.sel .rad{border-color:var(--blue);background:radial-gradient(circle,var(--blue) 42%,#fff 46%)}
.pickc .pic{width:48px;height:48px;border-radius:13px;background:var(--navy);color:#A9C3F5;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.pickc .pic svg{width:22px;height:22px}
.pickc b{font-family:'Sora',sans-serif;font-size:17px;display:block;margin-bottom:7px;color:var(--navy)}
.pickc p{font-size:13.5px;color:var(--mut);margin-bottom:16px;min-height:42px}
.pickc .pl{font-size:13px;font-weight:700;color:var(--blue);display:inline-flex;align-items:center;gap:7px}
.pickc .pl svg{width:15px;height:15px}
.center{text-align:center}

/* ================= AUTH (tabs 100% CSS) ================= */
.auth-wrap{max-width:470px;margin:0 auto;padding:40px 24px 90px}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(16,27,60,.04),0 8px 24px rgba(16,27,60,.07);overflow:hidden}
.auth-top{padding:22px 26px 0}
.auth-tabs{display:flex;border-bottom:1px solid var(--line);margin-top:14px}
.auth-tabs label{flex:1;text-align:center;padding:12px;font-size:14px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;transition:all .15s}
#at-login:checked~.auth-tabs label[for="at-login"],
#at-signup:checked~.auth-tabs label[for="at-signup"]{color:var(--blue);border-color:var(--blue)}
.tpanel{display:none;padding:22px 26px 26px}
#at-login:checked~.tp-login,#at-signup:checked~.tp-signup{display:block}
.auth-hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.auth-hrow h2{font-size:20px;color:var(--navy)}
.pchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;background:var(--blue-t);color:var(--blue-d);padding:5px 12px;border-radius:999px;margin-bottom:12px}
.pchip svg{width:13px;height:13px}
.demobtn{width:100%;border:1.5px dashed #B9C8EA;background:#F6F8FD;border-radius:11px;padding:13px;display:flex;align-items:center;gap:12px;text-align:left;transition:all .15s;color:inherit}
.demobtn:hover{border-color:var(--blue);background:var(--blue-t)}
.demobtn svg{width:18px;height:18px;color:var(--blue);flex-shrink:0}
.demobtn b{font-size:13.5px;display:block}
.demobtn span{font-size:12px;color:var(--mut)}
.divisor{display:flex;align-items:center;gap:12px;color:var(--soft);font-size:12px;margin:18px 0}
.divisor::before,.divisor::after{content:'';flex:1;height:1px;background:var(--line)}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.catcard{border:1.5px solid var(--line2);border-radius:12px;padding:18px 16px;cursor:pointer;display:block;transition:all .15s;background:#fff;text-align:left;width:100%}
.catcard:hover{border-color:var(--blue)}
.catcard b{font-family:'Sora',sans-serif;font-size:15px;display:block;margin-bottom:4px;color:var(--navy)}
.catcard span{font-size:12.5px;color:var(--mut);line-height:1.45;display:block}

/* ================= DASHBOARD INTERNO ================= */
.dash-hi{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.dash-hi h1{font-size:24px;color:var(--navy)}
.dash-hi .dt{font-size:13px;color:var(--mut);margin-top:4px}
.kstrip{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,27,60,.04),0 4px 16px rgba(16,27,60,.05);overflow:hidden;margin-bottom:22px}
.kpi{padding:18px 20px;border-left:1px solid var(--line);cursor:pointer;transition:background .14s;background:none;border-top:none;border-right:none;border-bottom:none;text-align:left}
.kpi:first-child{border-left:none}
.kpi:hover{background:#F7F9FD}
.kpi .kv{font-family:'Sora',sans-serif;font-size:27px;font-weight:700;letter-spacing:-.02em;color:var(--navy)}
.kpi .kl{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.35}
.dashgrid{display:grid;grid-template-columns:1.25fr .75fr;gap:22px;align-items:start}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.ph h3{font-size:15.5px}
.ph a{font-size:13px;font-weight:600;color:var(--blue);background:none;border:none;padding:0}
.ph a:hover{text-decoration:underline}
.qact{display:flex;gap:13px;align-items:center;background:var(--navy);color:#fff;border-radius:14px;padding:16px 20px;margin-bottom:22px;cursor:pointer;transition:transform .16s;flex-wrap:wrap;width:100%;text-align:left;border:none}
.qact:hover{transform:translateY(-2px)}
.qact .qa-ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qact .qa-ic svg{width:19px;height:19px;color:#A9C3F5}
.qact b{display:block;font-size:14.5px}
.qact span{font-size:12.5px;color:#9FB0D9}
.qact .btn{margin-left:auto}
.qlist{display:flex;flex-direction:column}
.qitem{display:flex;gap:13px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.qitem:last-child{border-bottom:none}
.qitem:hover b{color:var(--blue)}
.qic{width:32px;height:32px;border-radius:9px;background:#EDF1F9;display:flex;align-items:center;justify-content:center;color:#44506E;flex-shrink:0}
.qic svg{width:15px;height:15px}
.qitem b{font-size:13.5px;display:block}
.qitem span{font-size:12px;color:var(--mut);line-height:1.45}
.qitem .w{margin-left:auto;font-size:11.5px;color:var(--soft);white-space:nowrap}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.quick button{display:flex;align-items:center;gap:12px;padding:12px;background:none;border:none;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink);text-align:left;transition:background .14s;width:100%}
.quick button:hover{background:#EDF1F9}
.quick button svg{width:17px;height:17px;color:var(--blue)}
.quick button .cnt{margin-left:auto;font-size:11.5px;background:#EDF0F7;color:var(--mut);padding:2px 8px;border-radius:99px}

/* ================= CATÁLOGO EM CARDS ================= */
.toolbar{display:flex;gap:11px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--soft)}
.search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:600;color:#44506E;transition:all .14s;cursor:pointer;position:relative;display:inline-flex}
.chip:hover{border-color:var(--blue)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--navy);border-color:var(--navy);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:16px}
.pcard3{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 11px 13px;display:flex;flex-direction:column;gap:7px;transition:box-shadow .16s,border-color .16s,transform .16s}
.pcard3:hover{border-color:var(--blue);box-shadow:0 10px 26px -12px rgba(16,27,60,.3);transform:translateY(-2px)}
.pcard3-img{width:100%;aspect-ratio:1/1;border-radius:11px;overflow:hidden;background:#F1F4FA;border:none;padding:0;cursor:pointer}
.pcard3-img img{width:100%;height:100%;object-fit:cover;transition:transform .25s ease}
.pcard3:hover .pcard3-img img{transform:scale(1.04)}
.pcard3-cat{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:5px}
.pcard3-cat svg{width:12px;height:12px}
.pcard3-nm{font-weight:600;font-size:14px;line-height:1.35;color:var(--navy);cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.pcard3-nm:hover{color:var(--blue)}
.pcard3-meta{font-size:12px;color:var(--mut)}
.pcard3 .disp{font-size:12px}
.pcard3 .btn{margin-top:2px}
.empty{padding:56px 24px;text-align:center;color:var(--mut)}
.empty .eic{width:58px;height:58px;border-radius:15px;background:#EDF1F9;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#8A94AE}
.empty .eic svg{width:26px;height:26px}
.empty b{font-family:'Sora',sans-serif;font-size:16px;color:var(--ink);display:block;margin-bottom:6px}
.catzone:has(#cc-fixacao:checked) .pcard3:not(.cat-fixacao){display:none}
.catzone:has(#cc-eletrica:checked) .pcard3:not(.cat-eletrica){display:none}
.catzone:has(#cc-epi:checked) .pcard3:not(.cat-epi){display:none}
.catzone:has(#cc-ferramentas:checked) .pcard3:not(.cat-ferramentas){display:none}
.catzone:has(#cc-embalagens:checked) .pcard3:not(.cat-embalagens){display:none}
.catzone:has(#cc-hidraulica:checked) .pcard3:not(.cat-hidraulica){display:none}
.catzone:has(#cc-limpeza:checked) .pcard3:not(.cat-limpeza){display:none}

/* seletor de fornecedor (apenas no modal do produto) */
.supsel{display:grid;gap:10px}
.supsel label{display:flex;gap:11px;align-items:center;border:1.5px solid var(--line2);border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;position:relative}
.supsel input{position:absolute;opacity:0;pointer-events:none}
.supsel label:has(input:checked){border-color:var(--blue);background:var(--blue-t);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.supsel .sav{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;flex-shrink:0}
.supsel b{display:block;font-size:13.5px;color:var(--navy)}
.supsel small{font-size:12px;color:var(--mut)}

/* ================= CARRINHO / MODAL PRODUTO ================= */
.cartgrid{display:grid;grid-template-columns:1.5fr .8fr;gap:22px;align-items:start}
.sticky-side{position:sticky;top:104px}
.crow{display:grid;grid-template-columns:56px 1fr auto auto;gap:14px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none}
.stepper{display:flex;align-items:center;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:#fff}
.stepper button{width:32px;height:36px;border:none;background:#F1F4FA;font-size:16px;color:#44506E;display:flex;align-items:center;justify-content:center}
.stepper button:hover{background:#E4EAF5;color:var(--blue)}
.stepper input{width:58px;height:36px;border:none;outline:none;text-align:center;font-weight:600;font-family:'IBM Plex Mono',monospace;font-size:13.5px}
.sumrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;color:#44506E}
.sumrow b{font-variant-numeric:tabular-nums;text-align:right}
.pm-grid{display:grid;grid-template-columns:190px 1fr;gap:20px}
.pm-grid img{width:100%;border-radius:11px;border:1px solid var(--line);aspect-ratio:1;object-fit:cover;background:#EDF1F9}
.defg{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.defg dt{color:var(--soft);font-weight:500}
.defg dd{font-weight:500}

/* ================= CONFIRMAÇÃO / TIMELINE ================= */
.done-wrap{max-width:640px;margin:24px auto 0}
.done-ic{width:62px;height:62px;border-radius:50%;background:var(--ok-t);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.done-ic svg{width:30px;height:30px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:18px 0}
.meta-grid .mg{background:#F7F9FD;border:1px solid var(--line);border-radius:11px;padding:12px 15px}
.meta-grid .mg small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.meta-grid .mg b{font-size:14px;color:var(--navy)}
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl-i{position:relative;padding-bottom:20px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:'';position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--line2)}
.tl-i.done::before{background:var(--navy);border-color:var(--navy)}
.tl-i.cur::before{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.16)}
.tl-i b{font-size:14.5px;display:block;color:var(--navy)}
.tl-i span{font-size:13px;color:var(--mut)}

/* ================= COMPARAÇÃO ================= */
.cmp-sup{display:flex;align-items:flex-start;gap:10px}
.cmp-sup .sav{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;flex-shrink:0}
.cmp-sup b{font-size:13px;line-height:1.25;display:block;color:var(--navy)}
.cmp-sup span{font-size:11px;color:var(--mut);display:block}
.cmp-cell .pu{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;color:var(--navy)}
.cmp-cell .ex{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5}
.cmp-cell .nt{font-size:11.5px;color:var(--soft);font-style:italic;margin-top:4px}
.cmp-na{font-size:12.5px;color:var(--soft);display:flex;gap:7px;align-items:center}
.cmp-na svg{width:14px;height:14px}
.cmp-na.na-err{color:var(--err)}
.cmp-total{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--blue-d)}

/* ================= E-MAIL (PRÉVIA) ================= */
.mail{border-radius:13px;overflow:hidden;border:1px solid var(--line);text-align:left}
.mail-h{background:#F3F5FA;padding:15px 20px;border-bottom:1px solid var(--line)}
.mail-h .mr{display:flex;gap:8px;font-size:13px;margin-bottom:5px}
.mail-h .mr small{font-family:'IBM Plex Mono',monospace;color:var(--soft);width:60px;flex-shrink:0;font-size:11px;padding-top:1px}
.mail-b{padding:20px 24px;background:#fff;font-size:14px}
.mail-b table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
.mail-b th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);border-bottom:1px solid var(--line);padding:8px 10px;font-weight:500}
.mail-b td{padding:9px 10px;border-bottom:1px solid #F1F4FA}

/* ================= RESPONDER COTAÇÃO ================= */
.ritem{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:#fff}
.ritem.off{background:#F7F9FD}
.rhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rhead b{font-size:14.5px;color:var(--navy)}
.rq{margin-left:auto;font-size:13px;color:var(--mut);background:#EDF1F9;padding:4px 11px;border-radius:8px;white-space:nowrap}
.rfields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px;margin-top:14px}
.sw{position:relative;width:42px;height:23px;border-radius:99px;background:#C9D2E6;cursor:pointer;transition:background .18s;flex-shrink:0;display:inline-block}
.sw::after{content:'';position:absolute;top:2.5px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}
.sw.on::after{left:21px}
.swrow{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.rejbox{border:1px dashed #EFC5C5;background:#FDF7F7;border-radius:12px;padding:16px 18px;margin-top:16px}

/* ================= DIALOG (modais nativos) ================= */
dialog.mbox{margin:auto;border:none;padding:0;border-radius:16px;max-width:520px;width:calc(100vw - 44px);box-shadow:0 30px 70px -20px rgba(9,22,52,.5)}
dialog.mbox.wide{max-width:700px}
dialog.mbox::backdrop{background:rgba(9,17,40,.55);backdrop-filter:blur(2px)}
dialog.mbox[open]{animation:min .2s ease}
dialog.mbox.fallback{position:fixed;inset:0;margin:auto;align-self:center}
@keyframes min{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:19px 22px 0}
.m-head h3{font-size:17px;color:var(--navy)}
.m-x{width:32px;height:32px;border-radius:9px;border:none;background:#EDF1F9;color:#44506E;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m-x:hover{background:#E4EAF5}
.m-x svg{width:16px;height:16px}
.m-body{padding:16px 22px 22px}
.m-foot{display:flex;justify-content:flex-end;gap:10px;padding:0 22px 22px;flex-wrap:wrap}

/* ================= TOAST / LOADER ================= */
#toast-root{position:fixed;bottom:22px;right:22px;z-index:400;display:flex;flex-direction:column;gap:10px;max-width:min(380px,calc(100vw - 44px))}
.toast{display:flex;align-items:flex-start;gap:11px;background:var(--navy2);color:#E7ECF9;padding:13px 18px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:0 10px 30px -8px rgba(9,22,52,.55);animation:tin .28s ease;line-height:1.45}
.toast svg{width:17px;height:17px;flex-shrink:0;margin-top:1px}
.toast.ok svg{color:#5FD08F}
.toast.warn svg{color:#EBC26A}
.toast.err svg{color:#EF8E8E}
.toast.out{opacity:0;transition:opacity .3s}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.load-ovl{position:fixed;inset:0;background:rgba(243,245,250,.85);backdrop-filter:blur(3px);z-index:380;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.load-t{font-size:14px;color:#44506E;font-weight:500}

/* ================= ROADMAP ================= */
.rm{position:relative;padding-left:36px;max-width:660px}
.rm::before{content:'';position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--line2)}
.rmstep{position:relative;padding-bottom:30px}
.rmstep:last-child{padding-bottom:0}
.rmdot{position:absolute;left:-36px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;border:2.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--soft);font-family:'Sora',sans-serif}
.rmstep.cur .rmdot{background:var(--blue);border-color:var(--blue);color:#fff}
.rmstep h3{font-size:16.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--navy)}
.rmstep p{font-size:13.5px;color:var(--mut);margin:6px 0 10px}
.rmlist{display:flex;gap:8px;flex-wrap:wrap}
.rmlist span{font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;color:#44506E}
details.qacc{border:1px solid var(--line);border-radius:12px;background:#fff;max-width:660px}
details.qacc summary{cursor:pointer;padding:14px 18px;font-weight:600;font-size:14px;color:var(--mut);list-style:none;display:flex;align-items:center;gap:9px}
details.qacc summary::-webkit-details-marker{display:none}
details.qacc summary::after{content:'+';margin-left:auto;font-family:'IBM Plex Mono',monospace;color:var(--soft);font-size:16px}
details.qacc[open] summary{color:var(--blue)}
details.qacc[open] summary::after{content:'–'}
details.qacc .opendefs{padding:2px 18px 16px}
.opendefs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.opendefs span{font-size:12.5px;background:var(--warn-t);border:1px dashed #E3CD96;border-radius:8px;padding:5px 11px;color:var(--warn)}

/* ================= FOOTER PÚBLICO ================= */
.pubfoot{border-top:1px solid var(--line);padding:20px 34px;text-align:center;font-size:12.5px;color:var(--soft)}
.pubfoot b{color:#44506E}

/* ================= RESPONSIVO ================= */
@media(max-width:1020px){
  .kstrip{grid-template-columns:repeat(3,1fr)}

function countdownInfo(){
  var now=new Date(); var t=new Date(now); t.setHours(18,30,0,0);
  if(t<=now){ t.setDate(t.getDate()+1); }
  var diff=t-now;
  var h=Math.floor(diff/3600000), m=Math.floor((diff%3600000)/60000);
  return { rest: h+'h '+pad2(m)+'min', when: fmtDT(t) };
}

/* ================================================================
   === ROTA DASHBOARD ===
   Integração com dashboard.html + dashboard.js:
   1) saveSessao(): espelha o estado da sessão no localStorage
      a cada render — a dashboard lê e exibe os dados deste perfil.
   2) dashURL(go,secao): monta dashboard.html?perfil=...&go=...&secao=...
      com base no perfil ATIVO (nunca há troca de perfil na dashboard).
   3) retomarSessao(): ao voltar de dashboard.html?retomar=1,
      restaura a sessão e cai na tela pedida (&go=).
   4) clearSessao(): logout / troca de perfil invalidam a sessão.
   ================================================================ */
var DASH_ROUTES_BUYER=['dashB','catalog','cart','quoteNew','quotes','quoteDetail','compare','ordersB','profileB','notifs','roadmap'];
var DASH_ROUTES_SUP=['dashS','quotesSup','quoteResp','proposalReview','proposalSent','productsSup','reqProduct','ordersS','company','notifs','roadmap'];

function saveSessao(){
  try{
    if(!S.profile || !S.user){ return; }
    localStorage.setItem('dushell_sessao', JSON.stringify({
      perfil:S.profile, user:S.user,
      buyerCompany:BUYER_COMPANY, buyerShort:BUYER_SHORT, demoSup:DEMO_SUP,
      quotes:S.quotes, orders:S.orders, cart:S.cart, notifs:S.notifs, ts:Date.now()
    }));
  }catch(e){}
}
function clearSessao(){
  try{ localStorage.removeItem('dushell_sessao'); }catch(e){}
}
function dashURL(go, secao){
  var p=(S.profile==='supplier')?'fornecedor':'comprador';
  return 'dashboard.html?perfil='+p
    +(go?('&go='+encodeURIComponent(go)):'')
    +(secao?('&secao='+encodeURIComponent(secao)):'');
}
function retomarSessao(){
  try{
    var q=new URLSearchParams(location.search);
    if(q.get('retomar')!=='1'){ return; }
    var s=null;
    try{ s=JSON.parse(localStorage.getItem('dushell_sessao')||'null'); }catch(e){ s=null; }
    if(s && s.user && s.perfil){
      S.profile=s.perfil; S.user=s.user;
      if(s.buyerCompany){ BUYER_COMPANY=s.buyerCompany; }
      if(s.buyerShort){ BUYER_SHORT=s.buyerShort; }
      if(s.demoSup){ DEMO_SUP=s.demoSup; }
      var dest=q.get('go');
      var lista=(s.perfil==='supplier')?DASH_ROUTES_SUP:DASH_ROUTES_BUYER;
      S.screen=(dest && lista.indexOf(dest)>-1) ? dest : (s.perfil==='supplier'?'dashS':'dashB');
      setTimeout(function(){
        toast('Sessão retomada — '+(s.perfil==='supplier'?'fornecedor':'comprador')+' de demonstração.');
      },300);
    }
  }catch(e){}
}

function getQuote(id){ for(var i=0;i<S.quotes.length;i++){ if(S.quotes[i].id===id) return S.quotes[i]; } return null; }
function myQuotes(){ return S.quotes.filter(function(q){ return q.buyer===BUYER_COMPANY; }).sort(function(a,b){ return b.id.localeCompare(a.id); }); }
function supQuotes(){ return S.quotes.filter(function(q){ return q.notified.indexOf(DEMO_SUP)>-1; }).sort(function(a,b){ return b.id.localeCompare(a.id); }); }
function newSupCount(){ return supQuotes().filter(function(q){ return q.status!=='expirada' && !q.proposals.some(function(p){ return p.sup===DEMO_SUP; }); }).length; }
function unreadCount(w){ return S.notifs[w].filter(function(n){ return n.unread; }).length; }
function itemForSup(it,sid){ return !it.sup || it.sup===sid; }
function itemsForSup(q,sid){ return q.items.filter(function(it){ return itemForSup(it,sid); }); }
function recomputeStatus(q){
  var answered=0,refused=0;
  q.notified.forEach(function(sid){
    var pr=q.proposals.find(function(p){ return p.sup===sid; });
    if(pr){ if(pr.refused){ refused++; } else { answered++; } }
  });
  if(answered===0 && refused>0 && refused===q.notified.length){ q.status='recusada'; return; }
  if(answered===0){ q.status='aguardando'; return; }
  q.status=(answered<q.notified.length)?'parcial':'respondida';
}
function propTotal(q,pr){ var t=0; q.items.forEach(function(it){ if(itemForSup(it,pr.sup)){ var l=pr.lines[it.sku]; if(l){ t+=l.price*it.qty; } } }); return t; }
function propCovered(q,pr){ var n=0; q.items.forEach(function(it){ if(itemForSup(it,pr.sup) && pr.lines[it.sku]){ n++; } }); return n; }
function propMaxTerm(pr){ var m=0; for(var k in pr.lines){ var l=pr.lines[k]; if(l && l.term>m){ m=l.term; } } return m; }
function isOffering(sku){ return S.disp[sku]===undefined?true:!!S.disp[sku]; }
function cartQtyOf(sku){ return S.cart.filter(function(i){ return i.sku===sku; }).reduce(function(a,i){ return a+i.qty; },0); }

/* ---------- feedback UI ---------- */
function toast(msg,type){
  var t=document.createElement('div');
  t.className='toast '+(type||'ok');
  var ic=type==='warn'?'alert-triangle':(type==='err'?'x-circle':'check-circle-2');
  t.innerHTML='<i data-lucide="'+ic+'"></i><span>'+msg+'</span>';
  $('toast-root').appendChild(t); refreshIcons();
  setTimeout(function(){ t.classList.add('out'); setTimeout(function(){ if(t.parentNode){ t.parentNode.removeChild(t); } },350); },3400);
}
function modal(html,wide){
  closeModal();
  var d=document.createElement('dialog');
  d.className='mbox'+(wide?' wide':'');
  d.innerHTML=html;
  $('modal-root').appendChild(d);
  if(d.showModal){ d.showModal(); } else { d.setAttribute('open',''); d.classList.add('fallback'); }
  d.addEventListener('click',function(e){ if(e.target===d){ d.close(); } });
  d.addEventListener('close',function(){ if(d.parentNode){ d.parentNode.removeChild(d); } });
  refreshIcons();
  return d;
}
function closeModal(){
  document.querySelectorAll('dialog[open]').forEach(function(d){ try{ d.close(); }catch(e){} });

}

/* ---------- máscaras e formulários ---------- */
function mk(el,kind){
  var d=el.value.replace(/\D/g,'');
  if(kind==='cpf'){ d=d.slice(0,11); el.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); }
  if(kind==='cnpj'){ d=d.slice(0,14); el.value=d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2'); }
  if(kind==='cep'){ d=d.slice(0,8); el.value=d.replace(/(\d{5})(\d{1,2})$/,'$1-$2'); }
  if(kind==='tel'){ d=d.slice(0,11); el.value=d.replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{4,5})(\d{4})$/,'$1-$2'); }
}
function v(name){ var d=S.draft[name]; return (d===undefined||d===null)?'':d; }
function fld(name,label,req,type,ph,extra){
  return '<div class="fld"><label>'+label+(req?'':' <span class="opt">(opcional)</span>')+'</label>'
    +'<input class="inp" name="'+name+'" type="'+(type||'text')+'" placeholder="'+(ph||'')+'" '+(req?'data-req':'')
    +(extra||'')+' value="'+esc(v(name))+'"></div>';
}
function selFld(name,label,opts,req){
  return '<div class="fld"><label>'+label+(req?'':' <span class="opt">(opcional)</span>')+'</label>'
    +'<select class="sel" name="'+name+'" '+(req?'data-req':'')+'>'
    +opts.map(function(o){ return '<option'+(v(name)===o?' selected':'')+'>'+o+'</option>'; }).join('')
    +'</select></div>';
}
function txaFld(name,label,req,ph){
  return '<div class="fld"><label>'+label+(req?'':' <span class="opt">(opcional)</span>')+'</label>'
    +'<textarea class="txa" name="'+name+'" '+(req?'data-req':'')+' placeholder="'+(ph||'')+'">'+esc(v(name))+'</textarea></div>';
}
function grab(form){ var o={}; if(form){ form.querySelectorAll('[name]').forEach(function(el){ o[el.name]=el.value.trim(); }); } return o; }
function reqOk(form){
  var ok=true, docFaltando=false;
  form.querySelectorAll('[data-req]').forEach(function(el){
    var bad=!el.value || !String(el.value).trim();
    el.classList.toggle('bad',bad); if(bad){ ok=false; }
  });
  var V=window.DushellValida;
  form.querySelectorAll('[data-doc]').forEach(function(el){
    if(!V){ docFaltando=true; el.classList.add('bad'); ok=false; return; }
    if(!el.value || !String(el.value).trim()){ el.classList.add('bad'); ok=false; return; }
    var okDoc=V.docValido(el);
    el.classList.toggle('bad',!okDoc);
    if(!okDoc){ ok=false; }
  });
  form.querySelectorAll('input[data-reqchk]').forEach(function(el){
    if(!el.checked){ ok=false; var lb=el.closest('.chkline'); if(lb){ lb.classList.add('bad'); } }
  });
  if(docFaltando){
    toast('Arquivo “dushell-validacao.js” não encontrado ao lado do HTML — a validação de CPF/CNPJ é obrigatória e o avanço está bloqueado.','err');
  } else if(!ok){
    toast('Preencha os campos destacados com dados válidos para continuar.','warn');
  }
  return ok;
}

/* ---------- catálogo em cards ---------- */
function filteredProducts(){
  var q=S.f.q.toLowerCase();
  var list=PRODUCTS.filter(function(p){
    var okQ=!q || p.name.toLowerCase().indexOf(q)>-1 || p.sku.toLowerCase().indexOf(q)>-1 || p.brand.toLowerCase().indexOf(q)>-1;
    var okC=S.f.cat==='Todas' || p.cat===S.f.cat;
    var okS=S.f.sup==='Todos' || p.sup.indexOf(S.f.sup)>-1;
    return okQ&&okC&&okS;
  });
  if(S.f.sort==='nome'){ list=list.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }); }
  if(S.f.sort==='sku'){ list=list.slice().sort(function(a,b){ return a.sku.localeCompare(b.sku); }); }
  if(S.f.sort==='cat'){ list=list.slice().sort(function(a,b){ return a.cat.localeCompare(b.cat); }); }
  return list;
}
function onCatalogSearch(val){ S.f.q=val; updateCatalogList(); }
function setSort(val){ S.f.sort=val; updateCatalogList(); }
function setCat(c){ S.f.cat=c; updateCatalogList(); }
function setSup(val){ S.f.sup=val; updateCatalogList(); }
function setQF(st){ S.qf=st; if(S.screen!=='quotes'){ S.screen='quotes'; } render(); window.scrollTo(0,0); }
function catFilterText(){ return S.f.cat==='Todas'?'todas as categorias':S.f.cat; }
function supFilterText(){ return S.f.sup==='Todos'?'todos os fornecedores':SUPPLIERS[S.f.sup].short; }
function prodCards(list){
  if(!list.length){
    var motivo=(S.f.sup!=='Todos' && S.f.cat!=='Todas')
      ?'Nenhum produto de '+esc(SUPPLIERS[S.f.sup].short)+' na categoria '+esc(S.f.cat)+'.'
      :(S.f.sup!=='Todos'?'Este fornecedor ainda não tem itens no catálogo que correspondam à busca.':'Tente outro termo, código, marca ou categoria.');
    return emptyBox('search-x','Nenhum produto encontrado',motivo,
      '<button class="btn btn-s btn-sm" onclick="S.f.q=\'\';S.f.cat=\'Todas\';S.f.sup=\'Todos\';render();">Limpar filtros</button>');
  }
  return list.map(function(p){
    var noCarrinho=cartQtyOf(p.sku);
    return '<div class="pcard3 cat-'+slug(p.cat)+'">'
      +'<button class="pcard3-img" onclick="openProduct(\''+p.sku+'\')" aria-label="Ver '+esc(p.name)+'">'
      +'<img src="https://picsum.photos/seed/dsh-'+p.sku+'/420/420.jpg" alt="'+esc(p.name)+'"></button>'
      +'<div class="pcard3-cat"><i data-lucide="'+CATICON[p.cat]+'"></i>'+p.cat+'</div>'
      +'<div class="pcard3-nm" onclick="openProduct(\''+p.sku+'\')">'+p.name+'</div>'
      +'<div class="pcard3-meta">'+p.unit+' · Marca '+p.brand+'</div>'
      +'<div>'+dispBadge(p.avail)+'</div>'
      +'<button class="btn btn-p blk btn-sm" onclick="openProduct(\''+p.sku+'\')">'
      +(noCarrinho?'<i data-lucide="check"></i>No carrinho ('+noCarrinho+') — adicionar mais':'<i data-lucide="plus"></i>Adicionar à cotação')
      +'</button>'
      +'</div>';
  }).join('');
}
function updateCatalogList(){
  var list=filteredProducts();
  var el=$('plist'); if(el){ el.innerHTML=prodCards(list); }
  var c=$('pcount');
  if(c){ c.textContent=list.length+' produto(s) · '+supFilterText()+' · '+catFilterText()+' · o fornecedor é escolhido dentro do produto'; }
  refreshIcons();
}
function viewCatalog(){
  var list=filteredProducts();
  var chips=['Todas'].concat(CATS).map(function(c){
    return '<label class="chip"><input type="radio" name="cc" id="cc-'+slug(c)+'" value="'+c+'"'+(S.f.cat===c?' checked':'')+' onchange="setCat(this.value)"><span>'+c+'</span></label>';
  }).join('');
  var supOpts=Object.keys(SUPPLIERS).map(function(sid){
    return '<option value="'+sid+'"'+(S.f.sup===sid?' selected':'')+'>'+esc(SUPPLIERS[sid].short)+'</option>';
  }).join('');
  return appShell('catalog','Produtos','Catálogo de itens homologados pela Dushell',
    pageHead([{label:'Dashboard',screen:'dashB'},{label:'Catálogo de produtos'}],'Produtos disponíveis',
      'Itens homologados pela Dushell. Filtre por categoria ou fornecedor; a escolha final de quem cotar acontece dentro do produto.',
      null,'US-003','Eu como comprador, preciso visualizar os produtos disponíveis e filtrar por fornecedor, para encontrar o item certo de quem quero comprar.')
    +'<div class="toolbar">'
    +'<div class="search"><i data-lucide="search"></i><input placeholder="Buscar por nome, código ou marca…" value="'+esc(S.f.q)+'" oninput="onCatalogSearch(this.value)"></div>'
    +'<select class="sel" style="width:auto" onchange="setSup(this.value)" aria-label="Filtrar por fornecedor">'
    +'<option value="Todos"'+(S.f.sup==='Todos'?' selected':'')+'>Fornecedor: todos</option>'
    +supOpts
    +'</select>'
    +'<select class="sel" style="width:auto" onchange="setSort(this.value)">'
    +'<option value="rel"'+(S.f.sort==='rel'?' selected':'')+'>Ordenar: relevância</option>'
    +'<option value="nome"'+(S.f.sort==='nome'?' selected':'')+'>Ordenar: nome (A–Z)</option>'
    +'<option value="sku"'+(S.f.sort==='sku'?' selected':'')+'>Ordenar: código</option>'
    +'<option value="cat"'+(S.f.sort==='cat'?' selected':'')+'>Ordenar: categoria</option>'
    +'</select></div>'
    +'<div class="chips">'+chips+'</div>'
    +'<div class="catzone"><div class="pgrid" id="plist">'+prodCards(list)+'</div></div>'
    +'<div class="hint" id="pcount" style="margin-top:14px">'+list.length+' produto(s) · '+supFilterText()+' · '+catFilterText()+' · o fornecedor é escolhido dentro do produto</div>');
}
function openProduct(sku,preSup){

    +'<dt>Marca</dt><dd>'+p.brand+'</dd>'
    +'<dt>Unidade</dt><dd>'+p.unit+'</dd>'
    +'<dt>Fornecedores parceiros</dt><dd>'+p.sup.map(function(s){ return SUPPLIERS[s].short; }).join(' · ')+'</dd>'
    +'</dl>'
    +'<div class="note" style="margin-top:12px"><i data-lucide="info"></i><div>Os preços não são exibidos no catálogo: o valor é definido pela proposta do fornecedor na cotação.</div></div>'

    +'<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">'

    +'<button class="btn btn-p" style="margin-left:auto" onclick="addFromModal(\''+p.sku+'\')"><i data-lucide="shopping-cart"></i>Adicionar ao carrinho</button>'

}
function pqStep(d){ S.pq=Math.max(1,(S.pq||1)+d); var el=$('pq-input'); if(el){ el.value=S.pq; } }
function pqSet(val){ var n=parseInt(val,10); S.pq=isNaN(n)?1:Math.max(1,n); var el=$('pq-input'); if(el){ el.value=S.pq; } }
function addFromModal(sku){
  var p=P(sku);
  if(p.sup.length>1 && !S.pqs){ toast('Escolha o fornecedor para este item.','warn'); return; }
  addToCart(sku,S.pq||1,S.pqs||p.sup[0]||null,true);
}
function addToCart(sku,qty,sup,fromModal){
  var ex=S.cart.find(function(i){ return i.sku===sku && i.sup===sup; });
  if(ex){ ex.qty+=qty; } else { S.cart.push({sku:sku,qty:qty,sup:sup}); }
  if(fromModal){ closeModal(); }
  var supTxt=sup && SUPPLIERS[sup] ? ' · fornecedor '+SUPPLIERS[sup].short : '';
  toast(qty+' × '+P(sku).name+supTxt+' — no carrinho.');
  render();
}

/* ---------- carrinho ---------- */
function cartStep(sku,sup,d){ var it=S.cart.find(function(i){ return i.sku===sku && i.sup===sup; }); if(!it){ return; } it.qty=Math.max(1,it.qty+d); render(); }
function cartSetQty(sku,sup,val){ var it=S.cart.find(function(i){ return i.sku===sku && i.sup===sup; }); if(!it){ return; } var n=parseInt(val,10); it.qty=isNaN(n)?1:Math.max(1,Math.min(999999,n)); render(); }
function askRemoveItem(sku,sup){
  var p=P(sku);

    okLabel:'<i data-lucide="trash-2"></i>Remover item',danger:true,
    onOk:function(){ S.cart=S.cart.filter(function(i){ return !(i.sku===sku && i.sup===sup); }); toast('Item removido do carrinho.','warn'); render(); }});
}

  }
  return appShell('cart','Carrinho',rows.length+' produto(s) · '+fmtN(totQty)+' unidade(s) no total',
    pageHead([{label:'Dashboard',screen:'dashB'},{label:'Carrinho'}],'Meu carrinho de cotação',

      'US-004','Eu como comprador, preciso adicionar, remover e alterar quantidades dos produtos, para montar exatamente aquilo que desejo cotar.')

function askSendQuote(){
  var supIds=[];
  S.cart.forEach(function(ci){ if(ci.sup && supIds.indexOf(ci.sup)<0){ supIds.push(ci.sup); } });
  confirmModal({title:'Enviar esta cotação para os fornecedores selecionados?',
    body:'<p style="font-size:14px;color:var(--mut);margin-bottom:14px">Cada item será enviado ao fornecedor que você escolheu. Serão notificados <b style="color:var(--ink)">'+supIds.length+' fornecedor(es)</b>: '
      +supIds.map(function(s){ return SUPPLIERS[s].short; }).join(', ')+'.</p>'
      +'<div class="note"><i data-lucide="mail"></i><div>Cada fornecedor receberá um e-mail apenas com os itens direcionados a ele (simulado neste protótipo).</div></div>',
    okLabel:'<i data-lucide="send"></i>Confirmar envio',onOk:sendQuoteNow});
}
function sendQuoteNow(){
  run('Registrando cotação e notificando fornecedores…',1000,function(){
    var supIds=[];
    S.cart.forEach(function(ci){ if(ci.sup && supIds.indexOf(ci.sup)<0){ supIds.push(ci.sup); } });
    var obsEl=$('q-obs'),delEl=$('q-deliv'),dlEl=$('q-deadline');
    var q={id:'COT-000'+S.seq.q++,date:nowDT(),buyer:BUYER_COMPANY,buyerShort:BUYER_SHORT,status:'aguardando',
      items:S.cart.map(function(ci){ return {sku:ci.sku,qty:ci.qty,sup:ci.sup}; }),
      obs:obsEl?obsEl.value.trim():'',
      delivery:delEl?delEl.value:esc(S.user.addr),

/* ---------- comparação ---------- */
function viewCompare(){
  var q=getQuote(S.qid);
  if(!q){ S.screen='quotes'; return viewQuotes(); }
  var props={};
  q.notified.forEach(function(sid){
    props[sid]=q.proposals.find(function(p){ return p.sup===sid && !p.refused; })||null;
  });
  var answered=q.notified.filter(function(sid){ return props[sid]; }).length;
  var headCells=q.notified.map(function(sid){
    var pr=props[sid];
    var sub=pr?'respondeu em '+pr.sentAt.slice(-5):(q.status==='expirada'?'sem resposta · expirada':'sem resposta ainda');
    var win=q._winner===sid?'<span class="bdg st-mint" style="margin-left:auto"><i data-lucide="badge-check"></i>Selecionada</span>':'';
    return '<th style="min-width:210px;vertical-align:top"><div class="cmp-sup">'
      +'<div class="sav">'+SUPPLIERS[sid].ini+'</div>'
      +'<div><b>'+SUPPLIERS[sid].short+'</b><span>'+sub+'</span></div>'+win+'</div></th>';
  }).join('');
  var bodyRows=q.items.map(function(it){
    var p=P(it.sku);
    var cells=q.notified.map(function(sid){
      if(it.sup && it.sup!==sid){
        return '<td class="cmp-cell"><div class="cmp-na"><i data-lucide="corner-down-right"></i>Direcionado a '+esc(SUPPLIERS[it.sup].short)+'</div></td>';
      }
      var pr=props[sid];
      if(!pr){
        return '<td class="cmp-cell"><div class="cmp-na"><i data-lucide="'+(q.status==='expirada'?'timer-off':'hourglass')+'"></i>'
          +(q.status==='expirada'?'Expirou sem resposta':'Sem resposta ainda')+'</div></td>';
      }
      var l=pr.lines[it.sku];
      if(!l){ return '<td class="cmp-cell"><div class="cmp-na na-err"><i data-lucide="circle-slash"></i>Item não ofertado</div></td>'; }
      return '<td class="cmp-cell"><div class="pu">'+money(l.price)+' <span style="font-size:11px;color:var(--soft);font-weight:400">/ un.</span></div>'
        +'<div class="ex">Subtotal: <b class="mono" style="color:var(--ink)">'+money(l.price*it.qty)+'</b><br>Prazo: '+l.term+' dia(s) após confirmação</div>'
        +(l.note?'<div class="nt">'+esc(l.note)+'</div>':'')+'</td>';
    }).join('');
    return '<tr><td><b style="font-size:13.5px;color:var(--navy)">'+p.name+'</b><div class="sku">'+it.sku+' · '+p.unit+'</div>'
      +'<div style="font-size:12.5px;color:var(--mut);margin-top:3px">Solicitado: <b style="color:var(--ink)">'+fmtN(it.qty)+'</b>'
      +(it.sup?' · para '+esc(SUPPLIERS[it.sup].short):'')+'</div></td>'+cells+'</tr>';
  }).join('');
  var totalRow='<tr style="background:#F7F9FD"><td style="font-weight:700;color:var(--navy)">Total cotado</td>'
    +q.notified.map(function(sid){
      var pr=props[sid];
      if(!pr){ return '<td><span style="font-size:12.5px;color:var(--soft)">—</span></td>'; }
      return '<td><div class="cmp-total">'+money(propTotal(q,pr))+'</div>'
        +'<div style="font-size:12px;color:var(--mut);margin-top:3px">cobre '+propCovered(q,pr)+' de '+itemsForSup(q,sid).length+' itens direcionados · até '+propMaxTerm(pr)+' dias</div>'
        +'<div style="font-size:12px;color:var(--mut);margin-top:6px"><b style="color:var(--ink)">Condições:</b> '+esc(pr.conditions)+'</div>'
        +'<div style="margin-top:6px">'+RN()+'</div></td>';
    }).join('')+'</tr>';
  var actions;
  if(q._winner){
    actions='<div class="note" style="margin-top:18px"><i data-lucide="badge-check"></i><div>Proposta de <b>'+SUPPLIERS[q._winner].short+'</b> selecionada. Um pedido foi gerado — veja em <a style="color:var(--blue);font-weight:600" onclick="go(\'ordersB\')">Meus Pedidos</a>.</div></div>';
  } else if(answered>0){
    actions='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px">'
      +q.notified.filter(function(sid){ return props[sid]; }).map(function(sid){
        return '<button class="btn btn-p" onclick="askSelectProposal(\''+q.id+'\',\''+sid+'\')"><i data-lucide="badge-check"></i>Selecionar proposta — '+SUPPLIERS[sid].short+'</button>';
      }).join('')
      +'<button class="btn btn-s" onclick="go(\'quoteDetail\',\''+q.id+'\')">Voltar ao detalhe</button></div>';
  } else {
    actions='<div style="margin-top:18px"><button class="btn btn-s" onclick="go(\'quoteDetail\',\''+q.id+'\')"><i data-lucide="arrow-left"></i>Voltar ao detalhe da cotação</button></div>';
  }
  return appShell('quotes','Comparação de propostas',q.id+' · '+answered+' de '+q.notified.length+' proposta(s)',
    pageHead([{label:'Minhas cotações',screen:'quotes'},{label:q.id,screen:'quoteDetail',id:q.id},{label:'Comparação'}],'Comparar propostas',
      'Analise preço, prazo, disponibilidade e condições apresentados por cada fornecedor. A escolha é sua — a Dushell não indica um vencedor.',
      null,'US-007','Eu como comprador, preciso comparar as propostas recebidas, para analisar as condições antes de escolher.')
    +'<div class="panel tblwrap"><table class="tbl"><thead><tr><th style="min-width:230px">Item solicitado</th>'+headCells+'</tr></thead>'
    +'<tbody>'+bodyRows+totalRow+'</tbody></table></div>'
    +actions
    +'<div class="note" style="margin-top:16px"><i data-lucide="info"></i><div>Frete, impostos e condições finais integram a negociação comercial e seguem <b>regras de negócio a definir</b> pela Dushell.</div></div>');
}
function askSelectProposal(qid,sid){
  var q=getQuote(qid); if(!q){ return; }
  var pr=q.proposals.find(function(p){ return p.sup===sid && !p.refused; }); if(!pr){ return; }
  confirmModal({title:'Você deseja selecionar esta proposta?',
    body:'<div class="meta-grid" style="margin:0 0 14px">'
      +'<div class="mg"><small>Fornecedor</small><b>'+SUPPLIERS[sid].short+'</b></div>'
      +'<div class="mg"><small>Valor cotado</small><b class="mono">'+money(propTotal(q,pr))+'</b></div>'
      +'<div class="mg"><small>Prazo de entrega</small><b>até '+propMaxTerm(pr)+' dias</b></div>'
      +'<div class="mg"><small>Itens cobertos</small><b>'+propCovered(q,pr)+' de '+itemsForSup(q,sid).length+' direcionados</b></div></div>'
      +'<div class="note"><i data-lucide="info"></i><div>Após a seleção, o pedido é gerado para processamento. A etapa de <b>pagamento é futura</b> — regra de negócio a definir.</div></div>',
    okLabel:'<i data-lucide="badge-check"></i>Selecionar proposta',
    onOk:function(){ selectProposal(q,sid); }});

function selectProposal(q,sid){
  var pr=q.proposals.find(function(p){ return p.sup===sid && !p.refused; }); if(!pr){ return; }
  run('Gerando pedido a partir da proposta selecionada…',850,function(){
    q._winner=sid; q.status='aprovada';
    var items=[],total=0;
    q.items.forEach(function(it){
      if(itemForSup(it,sid)){ var l=pr.lines[it.sku]; if(l){ items.push({sku:it.sku,qty:it.qty}); total+=l.price*it.qty; } }
    });
    var o={id:'PED-000'+S.seq.p++,date:todayBR(),quote:q.id,sup:sid,buyer:q.buyer,buyerShort:q.buyerShort,items:items,total:total,status:'ag-pag'};
    S.orders.unshift(o); S.lastOrder=o.id;
    notif('buyer','Pedido gerado',o.id+' criado a partir da cotação '+q.id+' — proposta de '+SUPPLIERS[sid].short+'.','truck');
    if(sid===DEMO_SUP){ notif('supplier','Proposta aceita','Sua proposta na cotação '+q.id+' foi selecionada por '+q.buyerShort+'. Pedido '+o.id+' gerado.','badge-check'); }
    go('orderCreated');
  });
}

  if(mine){ return {k:'respondida',l:'Respondida — aguardando decisão',i:'hourglass',c:'st-warn'}; }
  if(q.status==='expirada'){ return {k:'expirada',l:'Expirada',i:'timer-off',c:'st-err'}; }

  if(!S.resp){ return; }
  document.querySelectorAll('[data-sku]').forEach(function(el){

    if(S.resp.items[sku] && S.resp.items[sku][f]!==undefined){ S.resp.items[sku][f]=el.value; }

function reviewProposal(){
  collectResp();
  var q=getQuote(S.resp.qid); if(!q){ return; }
  var bad=S.resp.list.filter(function(it){
    var r=S.resp.items[it.sku];
    return r.avail && (!parseFloat(r.price) || r.term==='');
  });
  if(bad.length){ toast('Informe preço unitário e prazo para todos os itens disponíveis.','warn'); return; }
  var allOff=S.resp.list.every(function(it){ return !S.resp.items[it.sku].avail; });
  if(allOff){ toast('Todos os itens estão indisponíveis. Recuse a cotação inteira ou oferte ao menos um item.','warn'); return; }
  go('proposalReview');
}
function viewProposalReview(){
  if(!S.resp){ S.screen='quotesSup'; return viewQuotesSup(); }
  var q=getQuote(S.resp.qid);
  if(!q){ S.resp=null; S.screen='quotesSup'; return viewQuotesSup(); }
  var rows=S.resp.list.filter(function(it){ return S.resp.items[it.sku].avail; });
  var total=0,maxTerm=0;
  var bodyRows=rows.map(function(it){
    var r=S.resp.items[it.sku];
    var price=parseFloat(r.price),term=parseInt(r.term,10)||0;
    var sub=price*it.qty; total+=sub; if(term>maxTerm){ maxTerm=term; }
    return '<tr><td><b style="font-size:13.5px;color:var(--navy)">'+P(it.sku).name+'</b><div class="sku">'+it.sku+'</div>'
      +(r.note?'<div style="font-size:12px;color:var(--soft);font-style:italic">'+esc(r.note)+'</div>':'')+'</td>'
      +'<td class="rgt num">'+fmtN(it.qty)+'</td>'
      +'<td class="rgt"><b class="mono">'+money(price)+'</b></td>'
      +'<td class="rgt"><b class="mono">'+money(sub)+'</b></td>'
      +'<td class="rgt num">'+term+' d</td></tr>';
  }).join('');
  return appShell('quotesSup','Revisão da proposta',q.id,
    pageHead([{label:'Cotações recebidas',screen:'quotesSup'},{label:'Responder',screen:'quoteResp',id:q.id},{label:'Revisão'}],'Revise sua proposta antes de enviar',
      'Confira preços, prazos e observações. A proposta é enviada ao comprador através da Dushell.',
      null,'US-011','Eu como fornecedor, preciso revisar minha proposta antes do envio, para garantir condições corretas ao comprador.')
    +'<div class="cartgrid"><div class="panel tblwrap"><table class="tbl">'
    +'<thead><tr><th>Produto</th><th class="rgt">Qtde</th><th class="rgt">Preço unit.</th><th class="rgt">Subtotal</th><th class="rgt">Prazo</th></tr></thead>'
    +'<tbody>'+bodyRows
    +'<tr style="background:#F7F9FD"><td colspan="3" style="font-weight:700;color:var(--navy)">Total da proposta</td>'
    +'<td class="rgt"><span class="cmp-total" style="font-size:17px">'+money(total)+'</span></td>'
    +'<td class="rgt num">'+maxTerm+' d (máx.)</td></tr>'
    +'</tbody></table></div>'
    +'<div class="sticky-side"><div class="panel p-pad">'
    +'<h3 style="font-size:16px;margin-bottom:12px;color:var(--navy)">Resumo do envio</h3>'
    +'<div class="sumrow"><span>Comprador</span><b style="font-size:13px">'+q.buyerShort+'</b></div>'
    +'<div class="sumrow"><span>Itens ofertados</span><b>'+rows.length+' de '+S.resp.list.length+'</b></div>'
    +'<div class="sumrow"><span>Condições</span><b style="font-size:12px;text-align:right;max-width:150px">'+CONDS[S.resp.cond]+'</b></div>'
    +'<div style="margin:6px 0 2px">'+RN()+'</div>'
    +'<hr class="sep">'
    +'<button class="btn btn-p blk btn-lg" onclick="askSendProposal()"><i data-lucide="send"></i>Enviar proposta</button>'
    +'<div class="hint">Itens marcados como indisponíveis ficam registrados como "não ofertados".</div>'
    +'</div></div></div>');

function askSendProposal(){
  var qid=S.resp.qid;
  confirmModal({title:'Enviar proposta ao comprador?',
    body:'<p style="font-size:14px;color:var(--mut)">A proposta da <b style="color:var(--ink)">'+SUPPLIERS[DEMO_SUP].short+'</b> será enviada ao comprador. Após o envio, ela fica disponível para comparação e decisão.</p>',
    okLabel:'<i data-lucide="send"></i>Enviar proposta',
    onOk:function(){ sendProposalNow(qid); }});
}
function sendProposalNow(qid){
  run('Enviando proposta ao comprador…',850,function(){
    var q=getQuote(qid); if(!q){ return; }
    var lines={};
    S.resp.list.forEach(function(it){
      var r=S.resp.items[it.sku];
      lines[it.sku]=r.avail?{price:parseFloat(r.price),term:parseInt(r.term,10)||0,note:r.note||null}:null;
    });
    q.proposals.push({sup:DEMO_SUP,sentAt:nowDT(),conditions:CONDS[S.resp.cond],lines:lines});
    recomputeStatus(q);
    notif('buyer','Proposta recebida',SUPPLIERS[DEMO_SUP].short+' respondeu à cotação '+q.id+'. Compare as propostas antes de escolher.','mail-check');
    S.resp=null;
    toast('Proposta enviada com sucesso.');
    go('proposalSent',qid);
  });
}

    +'<div class="avat" style="width:44px;height:44px;font-size:15px">'+s.ini+'</div>'
    +'<div><b style="font-size:15px;color:var(--navy)">'+s.short+'</b><div style="font-size:12.5px;color:var(--mut)">'+s.city+'</div></div></div>'
    +'<hr class="sep">'
    +'<div class="sumrow"><span>Produtos vinculados</span><b>'+PRODUCTS.filter(function(p){ return p.sup.indexOf(DEMO_SUP)>-1; }).length+'</b></div>'
    +'<div class="sumrow"><span>Cotações recebidas</span><b>'+supQuotes().length+'</b></div>'
    +'<div class="sumrow"><span>Propostas enviadas</span><b>'+S.quotes.reduce(function(a,q){ return a+q.proposals.filter(function(p){ return p.sup===DEMO_SUP && !p.refused; }).length; },0)+'</b></div>'
    +'<div class="sumrow"><span>Pedidos</span><b>'+S.orders.filter(function(o){ return o.sup===DEMO_SUP; }).length+'</b></div>'
    +'<hr class="sep">'
    +'<div class="note"><i data-lucide="info"></i><div>Edição de produtos e dados sensíveis pode exigir nova aprovação da Dushell. '+FUT('Módulo administrativo')+'</div></div>'
    +'</div></div></div>');
}

/* ================================================================
   COMUNS — NOTIFICAÇÕES E ROADMAP
   ================================================================ */
function viewNotifs(){
  var which=S.profile==='supplier'?'supplier':'buyer';
  var list=S.notifs[which];
  var unread=unreadCount(which);
  var dash=which==='supplier'?'dashS':'dashB';
  return appShell('notifs','Notificações',unread+' não lida(s)',
    pageHead([{label:'Dashboard',screen:dash},{label:'Notificações'}],'Notificações',
      'Central de avisos da plataforma. No produto final, com e-mails e alertas em tempo real (Etapa 3).',
      unread?'<button class="btn btn-s" onclick="markAllRead()"><i data-lucide="mail"></i>Marcar todas como lidas ('+unread+')</button>':'',
      'NTF','Eu como usuário, preciso de uma central de avisos, para não perder nenhuma movimentação importante.')
    +'<div class="panel">'
    +list.map(function(n){
      return '<div class="qitem" style="cursor:default;padding:15px 20px;'+(n.unread?'background:#F6F8FD;':'')+'">'
        +'<div class="qic" style="background:'+(n.unread?'var(--blue-t)':'#EDF1F9')+';color:'+(n.unread?'var(--blue-d)':'#44506E')+'"><i data-lucide="'+n.ic+'"></i></div>'
        +'<div><b>'+n.t+(n.unread?' <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);vertical-align:2px"></span>':'')+'</b>'
        +'<span>'+n.d+'</span></div><div class="w">'+n.w+'</div></div>';
    }).join('')
    +'</div>'
    +'<div class="note" style="margin-top:16px"><i data-lucide="mail"></i><div>Exemplos do produto final: cotação enviada, fornecedor respondeu, cotação expirando, proposta aceita, pedido confirmado, pagamento confirmado. '+FUT('Notificações reais — Etapa 3')+'</div></div>');
}
function markAllRead(){
  var which=S.profile==='supplier'?'supplier':'buyer';
  S.notifs[which].forEach(function(n){ n.unread=false; });
  toast('Todas as notificações marcadas como lidas.');
  render();
}
function viewRoadmap(){
  var steps=[
    {n:1,t:'Protótipo (você está aqui)',cur:true,d:'Esta entrega: validação visual e conceitual dos fluxos com dados simulados.',items:['Fluxos e telas principais','Escolha e filtro de fornecedor','Estados de interface e confirmações','Validação de CPF/CNPJ (dígito verificador)','Dashboard analítico com rotas por perfil']},
    {n:2,t:'Sistema funcional',d:'Implementação real do produto.',items:['Banco de dados','Usuários e autenticação','Produtos e categorias','Cotações e fornecedores','Pedidos']},
    {n:3,t:'Comunicação',d:'Canais entre plataforma, compradores e fornecedores.',items:['E-mails','Notificações e alertas','Controle do prazo de resposta (24h)']},
    {n:4,t:'Pagamentos',d:'Camada financeira da operação.',items:['Formas de pagamento','Gateway','Confirmação','Status financeiro']},
    {n:5,t:'Operação',d:'Consolidação da operação Dushell.',items:['Pedidos e logística','Histórico e indicadores','Administração Dushell']}
  ];
  var defs=['Quem paga a quem','Comissão / margem da Dushell','Distribuição automática vs. escolha manual de fornecedores','Frete','Impostos e regras fiscais','Validade das propostas','Cancelamentos e devoluções','Condições de pagamento'];
  var inner='<div class="uslab">ROADMAP · Evolução do produto</div>'
    +'<h1 style="font-size:26px;color:var(--navy);margin-bottom:8px;text-align:left">Próximas etapas</h1>'
    +'<p style="color:var(--mut);margin-bottom:28px;max-width:580px">Este protótipo representa a <b>Etapa 1</b>. As funcionalidades seguintes compõem a evolução natural do produto, respeitando o princípio de MVP.</p>'
    +'<div class="story" style="max-width:660px"><i data-lucide="clipboard-list"></i><span>Eu como cliente, preciso ver as próximas etapas do produto, para entender o caminho entre o protótipo e a operação real.</span></div>'
    +'<div class="rm">'
    +steps.map(function(s){
      return '<div class="rmstep'+(s.cur?' cur':'')+'"><div class="rmdot">'+s.n+'</div>'
        +'<h3>'+s.t+(s.cur?'<span class="bdg st-cop"><i data-lucide="map-pin"></i>você está aqui</span>':'')+'</h3>'
        +'<p>'+s.d+'</p>'
        +'<div class="rmlist">'+s.items.map(function(i){ return '<span>'+i+'</span>'; }).join('')+'</div></div>';
    }).join('')
    +'</div>'
    +'<details class="qacc" style="margin-top:10px">'
    +'<summary><i data-lucide="scale" style="width:15px;height:15px"></i>Decisões comerciais em aberto ('+defs.length+')</summary>'
    +'<div class="opendefs">'+defs.map(function(t){ return '<span>'+t+'</span>'; }).join('')+'</div>'
    +'</details>'
    +'<div style="margin-top:14px;max-width:660px">'+RN()+'</div>';
  if(S.user){
    return appShell('roadmap','Próximas etapas','Roadmap do produto Dushell',inner);
  }
  return pubHead()+'<div class="pick-wrap" style="max-width:860px">'
    +'<a class="back" onclick="go(\'entry\')"><i data-lucide="arrow-left"></i>Voltar ao início</a>'+inner
    +'</div>'+pubFoot();
}

/* ================================================================
   ROUTER
   ================================================================ */
var VIEWS={
  entry:viewEntry,pick:viewPick,auth:viewAuth,
  signupB:viewSignupB,signupS:viewSignupS,supPending:viewSupPending,
  dashB:viewDashB,catalog:viewCatalog,cart:viewCart,
  quoteNew:viewQuoteNew,quoteSent:viewQuoteSent,
  quotes:viewQuotes,quoteDetail:viewQuoteDetail,compare:viewCompare,
  orderCreated:viewOrderCreated,ordersB:viewOrdersB,profileB:viewProfileB,
  dashS:viewDashS,quotesSup:viewQuotesSup,quoteResp:viewQuoteResp,
  proposalReview:viewProposalReview,proposalSent:viewProposalSent,
  productsSup:viewProductsSup,reqProduct:viewReqProduct,ordersS:viewOrdersS,company:viewCompany,
  notifs:viewNotifs,roadmap:viewRoadmap
};
function render(){
  try{
    var fn=VIEWS[S.screen]||viewEntry;
    $('app').innerHTML=fn();
    document.body.classList.toggle('inapp',!!S.user);
    saveSessao();                       /* === ROTA DASHBOARD === espelha a sessão p/ dashboard.html */
    refreshIcons();
  }catch(e){
    if(window.console){ console.error(e); }
    var b=$('boot-msg');
    if(b){ b.style.display='block'; b.textContent='Erro no protótipo: '+e.message; }
  }
}
window.addEventListener('error',function(e){
  var b=$('boot-msg');
  if(b && $('app').querySelector('.boot')){ b.style.display='block'; b.textContent='Falha ao carregar o protótipo: '+(e.message||'erro desconhecido'); }
});
window.addEventListener('load',function(){
  if(!window.DushellValida){
    setTimeout(function(){ toast('Módulo “dushell-validacao.js” não carregado — CPF/CNPJ não serão validados até que o arquivo esteja na mesma pasta do HTML.','err'); },600);
  }
});
retomarSessao();                        /* === ROTA DASHBOARD === restaura sessão vinda de dashboard.html?retomar=1 */
render();
</script>
